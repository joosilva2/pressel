<!-- ==========================================================================
     TELA DE CARREGAMENTO
     Some sozinha aos 2,5 segundos. Para tirá-la, apague este bloco inteiro
     e também a tag <script> lá no final do arquivo.
     ========================================================================== -->
<div class="loading-screen" id="carregando">
  <div class="loading-inner">

    <div class="chat-icon">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 11.7a8.4 8.4 0 0 1-9 8.37 9.1 9.1 0 0 1-3.06-.6L3.5 21l1.6-4.55A8.4 8.4 0 1 1 20.5 11.7Z"/>
        <circle class="d1" cx="8.5"  cy="11.7" r="1.05" fill="currentColor" stroke="none"/>
        <circle class="d2" cx="12"   cy="11.7" r="1.05" fill="currentColor" stroke="none"/>
        <circle class="d3" cx="15.5" cy="11.7" r="1.05" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <h1 class="loading-title">Atendimento Online</h1>
    <p class="loading-subtitle">Preparando seu atendimento...</p>

    <div class="progress-wrapper">
      <span class="progress-label" id="porcentagem">0%</span>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>

    <div class="dots">

  </div>
</div>

    <!-- ======================================================================

<!-- Só anima o número da porcentagem. A barra e o sumiço da tela são feitos
     em CSS, então tudo funciona mesmo se o JavaScript estiver desligado. -->
<script>
  (function () {
    var alvo = document.getElementById('porcentagem');
    var tela = document.getElementById('carregando');
    if (!alvo) return;

    var duracao = 2500;
    var inicio  = null;

    function passo(agora) {
      if (inicio === null) inicio = agora;
      var pct = Math.min(100, Math.round((agora - inicio) / duracao * 100));
      alvo.textContent = pct + '%';
      if (pct < 100) requestAnimationFrame(passo);
    }
    requestAnimationFrame(passo);

    // tira a tela do DOM depois que ela termina de sumir
    setTimeout(function () {
      if (tela && tela.parentNode) tela.parentNode.removeChild(tela);
    }, 2900);
  })();
</script>

</body>
